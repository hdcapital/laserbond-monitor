name: announcements-daily

on:
  schedule:
    # daily 22:30 UTC = 08:30 AEST, after ASX morning releases start
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: store-commit
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[browser]"

      - name: Poll announcements + tungsten flags
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m lbl_tracker.cli ingest asx_announcements tungsten_news --strict \
            | tee poll-result.json

      - name: Refresh pulses + dashboard
        run: |
          python -m lbl_tracker.cli pulses
          python -m lbl_tracker.cli dashboard

      - name: Commit store + dashboard
        run: |
          git config user.name "lbl-tracker[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "ingest: daily announcement poll $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
