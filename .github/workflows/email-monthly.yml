name: email-monthly

on:
  schedule:
    # 1st of each month, 21:00 UTC = 07:00 AEST on the 2nd
    - cron: "0 21 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[browser]"

      - name: Rebuild summary from committed store
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python -m lbl_tracker.cli pulses
          python -m lbl_tracker.cli backtest || true
          python -m lbl_tracker.cli commentary || true
          python -m lbl_tracker.cli dashboard

      - name: Send brief
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python -m lbl_tracker.cli email
